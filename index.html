  <body>
    <!-- Safety net: If game crashes, this will show WHY instead of black screen -->
    <div id="error-overlay"></div>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var overlay = document.getElementById('error-overlay');
        if (overlay) {
          overlay.style.display = 'block';
          overlay.innerHTML = '<h2 style="color:red">GAME CRASHED</h2>' +
            '<p style="color:white">' + msg + '</p>' +
            '<p>Line: ' + lineNo + '</p>' + 
            '<p>Please check console or screenshot this.</p>';
        }
        return false;
      };
      window.addEventListener('unhandledrejection', function(event) {
        var overlay = document.getElementById('error-overlay');
        if (overlay) {
          overlay.style.display = 'block';
          overlay.innerHTML += '<p style="color:orange">Promise Error: ' + event.reason + '</p>';
        }
      });
    </script>

    <div id="root"></div>
    <!-- Vercel needs absolute path -->
    <script type="module" src="/index.tsx"></script>
  </body>
