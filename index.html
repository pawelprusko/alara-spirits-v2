      /* Debug Error Overlay */
      #error-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.95);
        color: #f87171;
        z-index: 99999;
        padding: 20px;
        font-family: monospace;
        font-size: 14px;
        white-space: pre-wrap;
        overflow: auto;
      }
    </style>
    <!-- REMOVED CONFLICTING IMPORTMAP -->
</head>
  <body>
    <div id="error-overlay"></div>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var overlay = document.getElementById('error-overlay');
        if (overlay) {
          overlay.style.display = 'block';
          overlay.innerHTML = '<h2 style="color:red">CRITICAL ERROR</h2>' +
            '<p style="color:white">' + msg + '</p>' +
            '<p>Line: ' + lineNo + '</p>';
        }
        return false;
      };
    </script>
